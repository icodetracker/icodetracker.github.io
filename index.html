<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iCode Lead Center</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-title" content="Lead Center">
  <style>
    /* Matches the app's dark background so there's no flash while it loads. */
    html, body { margin: 0; min-height: 100%; background: #111111; }
    .boot-msg { max-width: 34rem; margin: 15vh auto 0; padding: 0 16px; font: 16px/1.5 Roboto, system-ui, sans-serif; color: #b8b8b8; }
  </style>
</head>
<body>
  <p class="boot-msg" id="boot-msg">Loading the Lead Center…</p>
  <!--
    The iCode Lead Center lives in Google Apps Script. This page loads its
    screens from there and sends each request there in the background,
    without Google's sign-in cookies, so it works no matter how many Google
    accounts the browser is signed in to. It holds no code or data of its
    own: data needs a sign-in on every request. See docs/SETUP.md (Go live).
  -->
  <script>
    // The web app URL from Apps Script: Deploy > Manage deployments > Web app.
    // It stays the same when you publish new versions of that deployment.
    var APP = 'https://script.google.com/macros/s/AKfycbwf6vuNbARWu_xcJF8iSm_TgDYSuaZIsQjDbk8T_SQTPA5TC9e20pJozxG4IyVGNCf3Ww/exec';

    (function () {
      var msg = document.getElementById('boot-msg');
      function fail(text) { msg.textContent = text; }
      if (!/^https:\/\/script\.google\.com\/(macros|a\/macros\/[a-z0-9.-]+)\/s\/[A-Za-z0-9_-]+\/exec$/.test(APP)) {
        fail('The Lead Center isn\'t connected yet. Paste the Apps Script web app URL into this page (see docs/SETUP.md, Go live).');
        return;
      }

      // Google sign-in comes back to this address with its answer. Keep only
      // that, hand it to the app, and take it out of the address bar.
      var here = new URLSearchParams(location.search), google = null;
      if (here.has('state') && (here.has('code') || here.has('error'))) {
        google = { code: here.get('code') || '', state: here.get('state'), error: here.get('error') || '' };
      }
      if (location.search) history.replaceState(null, '', location.pathname + location.hash);
      window.__SITE_BOOT = { site: true, google: google };

      /** One request to the app: { fn, args } in, { ok, result | error } out. No cookies. */
      function post(fn, args) {
        return fetch(APP, {
          method: 'POST', credentials: 'omit', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // a "simple" request: no preflight
          body: JSON.stringify({ fn: fn, args: args })
        }).then(function (r) {
          if (!r.ok) throw new Error('The Lead Center did not answer (' + r.status + '). Try again.');
          return r.json();
        }, function () {
          throw new Error('Could not reach the Lead Center. Check your connection and try again.');
        }).then(function (j) {
          if (!j || !j.ok) throw new Error((j && j.error) || 'Something went wrong. Try again.');
          return j.result;
        });
      }

      // The screens call google.script.run.withSuccessHandler(..).fn(args), as
      // on Google's page. This does the same through post().
      function runner(ok, bad) {
        return new Proxy({}, {
          get: function (t, name) {
            if (name === 'withSuccessHandler') return function (f) { return runner(f, bad); };
            if (name === 'withFailureHandler') return function (f) { return runner(ok, f); };
            return function () {
              var args = JSON.parse(JSON.stringify(Array.prototype.slice.call(arguments), function (k, v) { return v === undefined ? null : v; }));
              post(String(name), args).then(function (r) { if (ok) ok(r); }, function (e) { if (bad) bad(e); });
            };
          }
        });
      }
      window.google = { script: { run: runner(), history: { replace: function () {} } } };

      /** Put the screens in this page: styles and links, then markup, then scripts in order. */
      function mount(html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var keepTheme = document.documentElement.getAttribute('data-theme');
        Array.prototype.forEach.call(doc.documentElement.attributes, function (a) { document.documentElement.setAttribute(a.name, a.value); });
        if (keepTheme) document.documentElement.setAttribute('data-theme', keepTheme);
        function place(node, parent) {
          if (node.nodeName === 'SCRIPT') {
            var s = document.createElement('script');
            s.textContent = node.textContent;
            parent.appendChild(s); // inline scripts run as they're added, in order
          } else if (node.nodeName !== 'TITLE') {
            parent.appendChild(document.importNode(node, true));
          }
        }
        Array.prototype.slice.call(doc.head.childNodes).forEach(function (n) { place(n, document.head); });
        msg.remove();
        Array.prototype.slice.call(doc.body.childNodes).forEach(function (n) { place(n, document.body); });
      }

      fetch(APP + '?asset=app', { credentials: 'omit', redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) { mount(j.html); })
        .catch(function () { fail('Could not load the Lead Center. Check your connection and reload the page.'); });
    })();
  </script>
  <noscript><p class="boot-msg">The Lead Center needs JavaScript turned on.</p></noscript>
</body>
</html>
