<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iCode Lead Center</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-title" content="Lead Center">
  <style>
    /* Matches the app's dark background so there's no flash while it loads. */
    html, body { margin: 0; height: 100%; background: #111111; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
    .msg { max-width: 34rem; margin: 15vh auto 0; padding: 0 16px; font: 16px/1.5 Roboto, system-ui, sans-serif; color: #d8d8d8; }
    .msg a { color: #8ab4f8; }
  </style>
</head>
<body>
  <!--
    The iCode Lead Center lives in Google Apps Script. This page only shows it
    at this address. It holds no code or data: everything stays in the owner's
    Google account behind the sign-in. See docs/SETUP.md (Go live).
  -->
  <script>
    // The web app URL from Apps Script: Deploy > Manage deployments > Web app.
    var APP = 'https://script.google.com/macros/s/AKfycbwf6vuNbARWu_xcJF8iSm_TgDYSuaZIsQjDbk8T_SQTPA5TC9e20pJozxG4IyVGNCf3Ww/exec';

    (function () {
      var ok = /^https:\/\/script\.google\.com\/(macros|a\/macros\/[a-z0-9.-]+)\/s\/[A-Za-z0-9_-]+\/exec$/.test(APP);
      if (!ok) {
        document.body.innerHTML = '<p class="msg">The Lead Center isn\'t connected yet. Paste the Apps Script web app URL into this page (see docs/SETUP.md, Go live).</p>';
        return;
      }
      // Google sign-in comes back to this address. Pass only its answer on to
      // the app, then take it out of the address bar.
      var here = new URLSearchParams(location.search), pass = new URLSearchParams();
      ['code', 'state', 'error'].forEach(function (k) { if (here.has(k)) pass.set(k, here.get(k)); });
      var frame = document.createElement('iframe');
      frame.src = APP + (pass.toString() ? '?' + pass.toString() : '');
      frame.title = 'iCode Lead Center';
      frame.allow = 'clipboard-write';
      document.body.appendChild(frame);
      if (location.search) history.replaceState(null, '', location.pathname + location.hash);
    })();
  </script>
  <noscript><p class="msg">The Lead Center needs JavaScript turned on.</p></noscript>
</body>
</html>
